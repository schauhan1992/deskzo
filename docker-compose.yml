name: deskzo

services:
  postgres:
    image: postgres:16-alpine
    container_name: deskzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskzo
      POSTGRES_PASSWORD: deskzo
      POSTGRES_DB: deskzo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskzo -d deskzo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
